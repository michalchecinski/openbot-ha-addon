# Standalone nginx config for the OpenBot Home Assistant add-on.
# Listens on 8080 and proxies the OpenBot setup page (8081), rewriting the
# page's absolute /api/* paths so they survive Home Assistant ingress.
# Started by run.sh as a background daemon.

worker_processes 1;
pid /run/nginx-openbot.pid;
error_log /dev/stderr;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;

  client_body_temp_path /tmp/nginx_client_body;
  proxy_temp_path       /tmp/nginx_proxy;
  fastcgi_temp_path     /tmp/nginx_fastcgi;
  uwsgi_temp_path       /tmp/nginx_uwsgi;
  scgi_temp_path        /tmp/nginx_scgi;

  server {
    listen 8080;
    allow 172.30.32.2;
    deny all;

    location / {
      proxy_pass http://127.0.0.1:8081;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Accept-Encoding "";

      sub_filter_once off;
      sub_filter_types application/javascript text/javascript;
      sub_filter '"/api/' '"$http_x_ingress_path/api/';
      sub_filter "'/api/" "'$http_x_ingress_path/api/";
      sub_filter '`/api/' '`$http_x_ingress_path/api/';

      # The rewritten script depends on the ingress path, so browsers must not cache the upstream immutable copy.
      proxy_hide_header Cache-Control;
      add_header Cache-Control "no-store" always;
    }
  }
}