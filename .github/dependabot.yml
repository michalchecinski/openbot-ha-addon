version: 2
updates:
  - package-ecosystem: docker
    directory: /openbot-server
    schedule:
      interval: daily
    commit-message:
      prefix: "deps"
  # Keeps the commit-SHA pins of the GitHub Actions up to date (including major upgrades).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
