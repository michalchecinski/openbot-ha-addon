# Polls GHCR for a new OpenBot release and opens a PR that bumps the pinned base
# image and the add-on version. Dependabot (daily) stays as a fallback.
#
# PRs opened with the default GITHUB_TOKEN do not trigger other workflows, so the
# "Build add-on images" check does not run on them. To get that check, add a
# personal access token (or GitHub App token) as the OPENBOT_UPDATE_TOKEN secret.
# Merging still triggers the build and publish on main.
name: Update OpenBot

on:
  schedule:
    # Off the top of the hour: GitHub delays scheduled runs when load is highest then.
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-openbot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.OPENBOT_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.OPENBOT_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Compare pinned and latest OpenBot version
        id: version
        run: |
          current="$(sed -nE 's#^FROM ghcr\.io/nightly-labs/openbot:([^ ]+).*#\1#p' openbot-server/Dockerfile | head -1)"
          if [ -z "$current" ]; then
            echo "::error::Could not read the OpenBot version from openbot-server/Dockerfile"
            exit 1
          fi
          latest="$(bash .github/scripts/latest-openbot-version.sh)"
          newest="$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)"
          if [ "$current" = "$latest" ] || [ "$newest" != "$latest" ]; then
            echo "OpenBot is up to date (pinned ${current}, latest ${latest})"
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "OpenBot ${latest} is newer than pinned ${current}"
          {
            echo "update=true"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

      # A closed PR counts too: closing it is how you skip a release.
      - name: Check for an existing update PR
        id: existing
        if: steps.version.outputs.update == 'true'
        env:
          BRANCH: deps/openbot-${{ steps.version.outputs.latest }}
        run: |
          count="$(gh pr list --head "$BRANCH" --state all --json number --jq length)"
          if [ "$count" -gt 0 ]; then
            echo "A PR for ${BRANCH} already exists, nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open update PR
        if: steps.version.outputs.update == 'true' && steps.existing.outputs.skip != 'true'
        env:
          LATEST: ${{ steps.version.outputs.latest }}
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          branch="deps/openbot-${LATEST}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"

          sed -i -E "s#^(FROM ghcr\.io/nightly-labs/openbot:)[^ ]+#\1${LATEST}#" openbot-server/Dockerfile
          bash .github/scripts/bump-addon-version.sh

          git add openbot-server/Dockerfile openbot-server/config.yaml openbot-server/CHANGELOG.md
          git commit -m "deps: update OpenBot to ${LATEST}"
          git push origin "$branch"

          gh pr create \
            --base "$BASE_REF" \
            --head "$branch" \
            --title "deps: update OpenBot to ${LATEST}" \
            --body "Automated update: OpenBot ${LATEST} was published to GHCR. Bumps the pinned base image and the add-on version."
