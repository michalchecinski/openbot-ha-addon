# Ships new OpenBot releases without manual steps:
#   prepare  - poll GHCR, open (or find) the update PR
#   validate - build the images from the PR branch, without publishing
#   merge    - squash-merge the PR once the build passed
#   publish  - build from main and push the images to GHCR
#
# The merge bypasses the main-pr ruleset: the GitHub Actions app is a bypass
# actor on it. A merge made with GITHUB_TOKEN does not trigger the push event,
# which is why the publish job calls the build explicitly. A failed build leaves
# the PR open; it is retried every run until it passes or you close the PR.
# Closing the PR skips that release. Dependabot (daily) stays as a fallback.
name: Update OpenBot

on:
  schedule:
    # Off the top of the hour: GitHub delays scheduled runs when load is highest then.
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-openbot
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      branch: ${{ steps.pr.outputs.branch }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare pinned and latest OpenBot version
        id: version
        run: |
          current="$(sed -nE 's#^FROM ghcr\.io/nightly-labs/openbot:([^ ]+).*#\1#p' openbot-server/Dockerfile | head -1)"
          if [ -z "$current" ]; then
            echo "::error::Could not read the OpenBot version from openbot-server/Dockerfile"
            exit 1
          fi
          latest="$(bash .github/scripts/latest-openbot-version.sh)"
          newest="$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)"
          if [ "$current" = "$latest" ] || [ "$newest" != "$latest" ]; then
            echo "OpenBot is up to date (pinned ${current}, latest ${latest})"
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "OpenBot ${latest} is newer than pinned ${current}"
          {
            echo "update=true"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

      - name: Find or open the update PR
        id: pr
        if: steps.version.outputs.update == 'true'
        env:
          LATEST: ${{ steps.version.outputs.latest }}
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          branch="deps/openbot-${LATEST}"
          existing="$(gh pr list --head "$branch" --state all --json number,state --jq '.[0] // empty')"
          state="$(jq -r '.state // empty' <<< "$existing")"

          if [ "$state" = "OPEN" ]; then
            echo "Reusing open PR for ${branch}"
            echo "pr=$(jq -r .number <<< "$existing")" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$state" ]; then
            echo "PR for ${branch} is ${state}, skipping this release"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"

          sed -i -E "s#^(FROM ghcr\.io/nightly-labs/openbot:)[^ ]+#\1${LATEST}#" openbot-server/Dockerfile
          BASE_REF="$BASE_REF" bash .github/scripts/bump-addon-version.sh

          git add openbot-server/Dockerfile openbot-server/config.yaml openbot-server/CHANGELOG.md
          git commit -m "deps: update OpenBot to ${LATEST}"
          git push origin "$branch"

          url="$(gh pr create \
            --base "$BASE_REF" \
            --head "$branch" \
            --title "deps: update OpenBot to ${LATEST}" \
            --body "Automated update: OpenBot ${LATEST} was published to GHCR. Bumps the pinned base image and the add-on version. Merged and published automatically once the build passes.")"
          echo "pr=${url##*/}" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

  validate:
    needs: prepare
    if: needs.prepare.outputs.pr != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yaml
    with:
      ref: ${{ needs.prepare.outputs.branch }}
      publish: false

  merge:
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash-merge the update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.prepare.outputs.pr }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch

  publish:
    needs: merge
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yaml
    with:
      ref: ${{ github.event.repository.default_branch }}
      publish: true
