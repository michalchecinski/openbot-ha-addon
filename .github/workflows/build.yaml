# Build the Home Assistant add-on image for openbot-server/ and push it to GHCR.
#
# NOTE: these images are not used by Home Assistant until the line
#   image: ghcr.io/<owner>/openbot-ha-addon-{arch}
# is added to openbot-server/config.yaml. The GHCR packages must be made public
# before that, otherwise Home Assistant cannot pull them.

name: Build add-on images

on:
  pull_request:
    paths:
      - 'openbot-server/**'
      - '.github/workflows/build.yaml'
  push:
    branches:
      - main
    paths:
      - 'openbot-server/**'
      - '.github/workflows/build.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version and image name
        id: meta
        shell: bash
        run: |
          version=$(sed -nE 's/^version: *"?([^"]+)"?.*/\1/p' openbot-server/config.yaml | head -1)
          if [ -z "$version" ]; then
            echo "::error::Could not read version from openbot-server/config.yaml"
            exit 1
          fi
          {
            echo "version=$version"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openbot-ha-addon-${{ matrix.arch }}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: openbot-server
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Unofficial Home Assistant add-on image for the OpenBot server (not affiliated with Synthetify Labs)
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0 (OpenBot) and MIT (wrapper files)