# Build the Home Assistant add-on image for openbot-server/ and push it to GHCR.

name: Build add-on images

on:
  pull_request:
    paths:
      - 'openbot-server/**'
      - '.github/workflows/build.yaml'
  push:
    branches:
      - main
    paths:
      - 'openbot-server/**'
      - '.github/workflows/build.yaml'
  workflow_dispatch:
    inputs:
      publish:
        description: Push the images to GHCR
        type: boolean
        default: true
  # Used by the "Update OpenBot" workflow: build a branch without publishing,
  # then publish from main after the merge.
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (default is the caller's ref)
        type: string
        default: ''
      publish:
        description: Push the images to GHCR
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # Pull requests only build. Pushes to main publish, and so do manual and
      # reusable-workflow runs that ask for it.
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}

      - name: Read version and image name
        id: meta
        shell: bash
        run: |
          version=$(sed -nE 's/^version: *"?([^"]+)"?.*/\1/p' openbot-server/config.yaml | head -1)
          if [ -z "$version" ]; then
            echo "::error::Could not read version from openbot-server/config.yaml"
            exit 1
          fi
          {
            echo "version=$version"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openbot-ha-addon-${{ matrix.arch }}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: openbot-server
          platforms: ${{ matrix.platform }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Unofficial Home Assistant add-on image for the OpenBot server (not affiliated with Synthetify Labs)
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0 (OpenBot) and MIT (wrapper files)